<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBgStats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="cardGlowStats" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .stat-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #38bdf8; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 500; fill: #94a3b8; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #e2e8f0; }
  </style>

  <!-- Card Frame -->
  <rect width="398" height="198" x="1" y="1" rx="10" fill="url(#cardBgStats)" stroke="#30363d" stroke-width="1" filter="url(#cardGlowStats)"/>

  <!-- Title -->
  <text x="25" y="34" class="stat-title">📊 GitHub Telemetry</text>
  <circle cx="365" cy="30" r="4" fill="#818cf8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Total Stars -->
  <g transform="translate(25, 62)">
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="#f59e0b" stroke-width="1.5" fill="none" transform="scale(0.8) translate(0,-2)"/>
    <text x="28" y="13" class="stat-label">Total Stars Earned:</text>
    <text x="350" y="13" text-anchor="end" class="stat-val">6</text>
  </g>

  <!-- Total Commits -->
  <g transform="translate(25, 94)">
    <circle cx="10" cy="9" r="6" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <path d="M4 9h-4 M16 9h4" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="28" y="13" class="stat-label">Total Commits:</text>
    <text x="350" y="13" text-anchor="end" class="stat-val">24+</text>
  </g>

  <!-- Repositories Contributed -->
  <g transform="translate(25, 126)">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="#a855f7" stroke-width="1.5" fill="none" transform="scale(0.8) translate(0,-2)"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="#a855f7" stroke-width="1.5" fill="none" transform="scale(0.8) translate(0,-2)"/>
    <text x="28" y="13" class="stat-label">Total Repositories:</text>
    <text x="350" y="13" text-anchor="end" class="stat-val">4</text>
  </g>

  <!-- Current Rank -->
  <g transform="translate(25, 158)">
    <circle cx="10" cy="9" r="6.5" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <path d="M7 9l2 2 4-4" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <text x="28" y="13" class="stat-label">Activity Status:</text>
    <text x="350" y="13" text-anchor="end" class="stat-val" fill="#10b981">🟢 Active Developer</text>
  </g>

</svg>
