<svg width="100%" height="100%" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="paraboleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="75%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .star { animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .grid-line { stroke: #38bdf8; stroke-opacity: 0.07; stroke-width: 1; }
    .parabole-letter {
      fill: url(#shimmer);
      filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.35));
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="260" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Cyber Grid in Background -->
  <g>
    <line x1="100" y1="0" x2="100" y2="260" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="260" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="260" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="260" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="260" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="260" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="260" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="260" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="260" class="grid-line" />
    <line x1="0" y1="65" x2="1000" y2="65" class="grid-line" />
    <line x1="0" y1="130" x2="1000" y2="130" class="grid-line" />
    <line x1="0" y1="195" x2="1000" y2="195" class="grid-line" />
  </g>

  <!-- Animated Waves at the bottom -->
  <path fill="url(#wave1)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="
        M0 260 L0 180 Q 250 140 500 180 T 1000 170 L1000 260 Z;
        M0 260 L0 160 Q 250 200 500 160 T 1000 190 L1000 260 Z;
        M0 260 L0 180 Q 250 140 500 180 T 1000 170 L1000 260 Z
      " />
  </path>
  <path fill="url(#wave2)">
    <animate attributeName="d" dur="14s" repeatCount="indefinite"
      values="
        M0 260 L0 200 Q 300 220 600 180 T 1000 200 L1000 260 Z;
        M0 260 L0 180 Q 300 160 600 210 T 1000 170 L1000 260 Z;
        M0 260 L0 200 Q 300 220 600 180 T 1000 200 L1000 260 Z
      " />
  </path>

  <!-- Ambient Twinkling Dots -->
  <circle cx="120" cy="50" r="2" fill="#38bdf8" class="star" style="animation-delay: 0.2s;" />
  <circle cx="280" cy="40" r="1.5" fill="#818cf8" class="star" style="animation-delay: 1.1s;" />
  <circle cx="450" cy="30" r="2.5" fill="#c084fc" class="star" style="animation-delay: 0.7s;" />
  <circle cx="680" cy="45" r="2" fill="#38bdf8" class="star" style="animation-delay: 1.8s;" />
  <circle cx="860" cy="35" r="1.5" fill="#f472b6" class="star" style="animation-delay: 2.3s;" />
  <circle cx="920" cy="70" r="2" fill="#38bdf8" class="star" style="animation-delay: 0.5s;" />
  <circle cx="80" cy="190" r="1.5" fill="#818cf8" class="star" style="animation-delay: 1.4s;" />

  <!-- ================= PARABOLE FONT GLYPHS: "rushwin" ================= -->
  <!-- Authentic Parabole typeface structure: intersecting parabolic curves, inverted lens cutouts, and continuous flow -->
  <g class="parabole-letter" transform="translate(140, 60) scale(1.15)">

    <!-- LETTER 'r' (x=0) -->
    <!-- Parabole 'r': Stem with parabolic inner lens cut, connected to a sweeping parabolic upper shoulder -->
    <g transform="translate(0, 20)">
      <!-- Left Stem with parabolic cut -->
      <path d="M0,0 L18,0 C18,20 10,40 18,70 L0,70 C8,40 0,20 0,0 Z"/>
      <!-- Parabolic Shoulder Arc -->
      <path d="M16,10 C24,-2 48,-6 62,8 C66,12 68,18 68,24 C56,12 40,8 24,18 C20,20 18,24 16,30 Z"/>
      <!-- Intersecting Lens Core -->
      <path d="M16,12 C30,4 52,14 56,26 C44,18 28,18 16,28 Z" opacity="0.9"/>
    </g>

    <!-- LETTER 'u' (x=80) -->
    <!-- Parabole 'u': Two vertical stems converging into twin parabolic bottom arcs with inner lens counter -->
    <g transform="translate(80, 20)">
      <!-- Left Stem -->
      <path d="M0,0 L18,0 C18,25 12,45 18,52 C24,60 40,64 54,54 C60,48 56,25 56,0 L74,0 C74,35 72,56 58,66 C42,76 18,74 6,60 C-2,50 0,25 0,0 Z"/>
      <!-- Inner Parabolic Inverted Lens Accent -->
      <path d="M18,35 C28,48 44,48 54,35 C46,55 26,55 18,35 Z" opacity="0.95"/>
    </g>

    <!-- LETTER 's' (x=170) -->
    <!-- Parabole 's': Intersecting S-curve with signature parabolic inverted lens loops -->
    <g transform="translate(170, 20)">
      <!-- Upper Loop with Parabolic Lens -->
      <path d="M56,14 C50,2 34,-2 18,4 C4,9 0,22 10,32 C22,42 54,40 58,54 C62,68 44,74 26,72 C10,70 2,60 0,50 L16,48 C18,56 26,60 38,59 C46,58 48,50 44,44 C34,34 6,36 2,20 C-2,6 14,-2 32,-1 C46,0 58,6 64,16 Z"/>
      <!-- Center Parabolic Intersection Core -->
      <path d="M14,24 C28,16 46,26 40,38 C28,42 16,34 14,24 Z" opacity="0.85"/>
      <path d="M22,46 C34,42 50,50 44,60 C32,64 22,54 22,46 Z" opacity="0.85"/>
    </g>

    <!-- LETTER 'h' (x=250) -->
    <!-- Parabole 'h': Tall ascender with parabolic waist, bridging to parabolic arch -->
    <g transform="translate(250, 0)">
      <!-- Tall Ascender Stem -->
      <path d="M0,0 L18,0 C18,30 10,60 18,90 L0,90 C8,60 0,30 0,0 Z"/>
      <!-- Parabolic Arch & Right Leg -->
      <path d="M16,32 C26,20 48,16 62,28 C74,38 72,60 72,90 L54,90 C54,65 58,44 48,36 C38,28 24,32 16,42 Z"/>
      <!-- Interlocking Lens Arch -->
      <path d="M18,34 C32,24 54,28 56,44 C44,34 28,34 18,46 Z" opacity="0.9"/>
    </g>

    <!-- LETTER 'w' (x=340) -->
    <!-- Parabole 'w': Double parabolic interlocking wave stems -->
    <g transform="translate(340, 20)">
      <!-- Left Valley -->
      <path d="M0,0 L18,0 C18,25 14,48 24,54 C32,60 44,52 48,35 L48,0 L66,0 C66,25 62,48 72,54 C80,60 92,52 96,35 L96,0 L114,0 C114,35 106,62 90,68 C74,74 60,62 56,48 C52,62 38,74 22,68 C6,62 0,35 0,0 Z"/>
      <!-- Parabolic Intersection Lenses -->
      <path d="M18,32 C26,45 38,45 46,32 C38,50 24,50 18,32 Z" opacity="0.95"/>
      <path d="M66,32 C74,45 86,45 94,32 C86,50 72,50 66,32 Z" opacity="0.95"/>
    </g>

    <!-- LETTER 'i' (x=470) -->
    <!-- Parabole 'i': Vertical stem with parabolic lens cuts + distinct geometric parabolic dot -->
    <g transform="translate(470, 0)">
      <!-- Parabolic Dot -->
      <path d="M0,4 C0,-2 18,-2 18,4 C18,10 0,10 0,4 C6,4 12,4 18,4 C12,12 6,12 0,4 Z" fill="url(#shimmer)"/>
      <circle cx="9" cy="4" r="7" fill="url(#shimmer)"/>
      <!-- Stem -->
      <path d="M0,20 L18,20 C18,40 10,60 18,90 L0,90 C8,60 0,40 0,20 Z"/>
      <!-- Mid-stem Parabolic lens accent -->
      <path d="M2,45 C8,38 12,38 18,45 C12,52 8,52 2,45 Z" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- LETTER 'n' (x=505) -->
    <!-- Parabole 'n': Left stem with arching parabolic shoulder and right stem with lens counter -->
    <g transform="translate(505, 20)">
      <!-- Left Stem -->
      <path d="M0,0 L18,0 C18,25 10,48 18,70 L0,70 C8,48 0,25 0,0 Z"/>
      <!-- Parabolic Arch & Right Stem -->
      <path d="M16,12 C26,0 48,-4 62,8 C74,18 72,40 72,70 L54,70 C54,45 58,24 48,16 C38,8 24,12 16,22 Z"/>
      <!-- Interlocking Lens Arch Counter -->
      <path d="M18,14 C32,4 54,8 56,24 C44,14 28,14 18,26 Z" opacity="0.9"/>
    </g>

  </g>

  <!-- Bottom Accent Line -->
  <rect x="250" y="210" width="500" height="2" rx="1" fill="url(#shimmer)" opacity="0.6"/>
  <circle cx="500" cy="211" r="4" fill="#38bdf8" filter="url(#softGlow)"/>

</svg>
