<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="cppGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .lang-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #38bdf8; }
    .lang-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    .lang-pct { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #94a3b8; }
    .bar-bg { fill: #21262d; rx: 4px; }
    .bar-fill { rx: 4px; }
  </style>

  <!-- Card Frame -->
  <rect width="398" height="198" x="1" y="1" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1" filter="url(#cardGlow)"/>

  <!-- Title -->
  <text x="25" y="32" class="lang-title">⚡ Top Languages</text>
  <circle cx="365" cy="28" r="4" fill="#38bdf8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Composite Progress Bar -->
  <g transform="translate(25, 48)">
    <rect width="350" height="8" rx="4" fill="#21262d"/>
    <rect width="122" height="8" rx="4" fill="url(#pyGrad)"/>
    <rect x="124" width="87" height="8" rx="4" fill="url(#jsGrad)"/>
    <rect x="213" width="63" height="8" rx="4" fill="url(#cppGrad)"/>
    <rect x="278" width="42" height="8" rx="4" fill="url(#javaGrad)"/>
    <rect x="322" width="28" height="8" rx="4" fill="url(#cGrad)"/>
  </g>

  <!-- Language Rows -->
  <!-- Python -->
  <g transform="translate(25, 80)">
    <circle cx="5" cy="5" r="5" fill="url(#pyGrad)"/>
    <text x="18" y="9" class="lang-name">Python</text>
    <text x="140" y="9" class="lang-pct">35.0%</text>
    <rect x="185" y="1" width="190" height="7" class="bar-bg"/>
    <rect x="185" y="1" width="66" height="7" fill="url(#pyGrad)" class="bar-fill">
      <animate attributeName="width" from="0" to="66" dur="1.2s" fill="freeze"/>
    </rect>
  </g>

  <!-- JavaScript -->
  <g transform="translate(25, 104)">
    <circle cx="5" cy="5" r="5" fill="url(#jsGrad)"/>
    <text x="18" y="9" class="lang-name">JavaScript</text>
    <text x="140" y="9" class="lang-pct">25.0%</text>
    <rect x="185" y="1" width="190" height="7" class="bar-bg"/>
    <rect x="185" y="1" width="47" height="7" fill="url(#jsGrad)" class="bar-fill">
      <animate attributeName="width" from="0" to="47" dur="1.2s" fill="freeze"/>
    </rect>
  </g>

  <!-- C++ -->
  <g transform="translate(25, 128)">
    <circle cx="5" cy="5" r="5" fill="url(#cppGrad)"/>
    <text x="18" y="9" class="lang-name">C++</text>
    <text x="140" y="9" class="lang-pct">18.0%</text>
    <rect x="185" y="1" width="190" height="7" class="bar-bg"/>
    <rect x="185" y="1" width="34" height="7" fill="url(#cppGrad)" class="bar-fill">
      <animate attributeName="width" from="0" to="34" dur="1.2s" fill="freeze"/>
    </rect>
  </g>

  <!-- Java -->
  <g transform="translate(25, 152)">
    <circle cx="5" cy="5" r="5" fill="url(#javaGrad)"/>
    <text x="18" y="9" class="lang-name">Java</text>
    <text x="140" y="9" class="lang-pct">12.0%</text>
    <rect x="185" y="1" width="190" height="7" class="bar-bg"/>
    <rect x="185" y="1" width="23" height="7" fill="url(#javaGrad)" class="bar-fill">
      <animate attributeName="width" from="0" to="23" dur="1.2s" fill="freeze"/>
    </rect>
  </g>

  <!-- C -->
  <g transform="translate(25, 176)">
    <circle cx="5" cy="5" r="5" fill="url(#cGrad)"/>
    <text x="18" y="9" class="lang-name">C</text>
    <text x="140" y="9" class="lang-pct">10.0%</text>
    <rect x="185" y="1" width="190" height="7" class="bar-bg"/>
    <rect x="185" y="1" width="19" height="7" fill="url(#cGrad)" class="bar-fill">
      <animate attributeName="width" from="0" to="19" dur="1.2s" fill="freeze"/>
    </rect>
  </g>

</svg>
